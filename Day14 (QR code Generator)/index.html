<!Doctype html>
<html>
    <head>
        <title>Day 14 QR code generator</title>
    </head>
    <body>
        <h1>QR Code Generator</h1>
        <input type="text" id="text" placeholder="Enter text or URL">
        <br><br>
        <button onclick="generateQRCode()">Generate QR Code</button>
        <div id="qrcode">
            
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.0/qrcode.min.js"></script>

        <script>
            function generateQRCode(){
                const textt = document.getElementById("text").value;
                const qrCodeContainer = document.getElementById("qrcode");
                qrCodeContainer.innerHTML = "";
                if (textt.trim() !== ""){
                    new QRcode(qrCodeContainer, {text: textt, width: 150, height: 150});
                }
            }
        </script>
    </body>
</html>
